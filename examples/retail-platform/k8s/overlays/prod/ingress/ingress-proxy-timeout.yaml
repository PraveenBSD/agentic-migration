apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy-timeout-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
spec:
  rules:
    - host: timeout.example.com
      http:
        paths:
          - path: /slow
            pathType: Prefix
            backend:
              service:
                name: slow-service
                port:
                  number: 8080
