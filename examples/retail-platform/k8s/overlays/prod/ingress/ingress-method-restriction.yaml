apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: method-restricted-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_method !~ ^(GET|POST|OPTIONS)$) {
        return 405;
      }
spec:
  rules:
    - host: methods.example.com
      http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 8080
