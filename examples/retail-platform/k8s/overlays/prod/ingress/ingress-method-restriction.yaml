apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-1.1.0
  name: nginx
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
  - hostname: methods.example.com
    name: methods-example-com-http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-1.1.0
  name: method-restricted-ingress-methods-example-com
  namespace: default
spec:
  hostnames:
  - methods.example.com
  parentRefs:
  - name: nginx
  rules:
  - backendRefs:
    - name: orders-api
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /orders
    name: rule-0
status:
  parents: []
