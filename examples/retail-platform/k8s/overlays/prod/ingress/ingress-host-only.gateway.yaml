apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-1.1.0
  name: nginx
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
  - hostname: shop.example.com
    name: shop-example-com-http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-1.1.0
  name: host-based-ingress-shop-example-com
  namespace: default
spec:
  hostnames:
  - shop.example.com
  parentRefs:
  - name: nginx
  rules:
  - backendRefs:
    - name: storefront
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
    name: rule-0
status:
  parents: []
