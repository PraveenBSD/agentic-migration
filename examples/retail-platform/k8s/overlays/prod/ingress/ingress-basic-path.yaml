apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basic-path-ingress
  namespace: default
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 80
