apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: underscores-headers-ingress
  namespace: default
spec:
  parentRefs:
    - name: envoy-gateway
  hostnames:
    - underscores.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X_CUSTOM_HEADER
                value: "yes"
      backendRefs:
        - name: header-service
          port: 80
