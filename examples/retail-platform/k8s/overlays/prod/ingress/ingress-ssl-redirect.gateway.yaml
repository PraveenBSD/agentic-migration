apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ssl-redirect-ingress
  namespace: default
spec:
  parentRefs:
  - name: envoy-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: storefront
      port: 80
  hostnames:
  - redirect.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ssl-redirect-ingress-https-redirect
  namespace: default
spec:
  parentRefs:
  - name: envoy-gateway
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
  hostnames:
  - redirect.example.com
