apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-modification-ingress
  namespace: default
spec:
  parentRefs:
    - name: envoy-gateway
  hostnames:
    - headers.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Tenant
                value: retail-prod
              - name: X-Forwarded-Proto
                value: https
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
            remove:
              - X-Powered-By
      backendRefs:
        - name: header-service
          port: 80
