apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-1.1.0
  name: nginx
  namespace: default
spec:
  gatewayClassName: nginx
  listeners:
  - hostname: assets.example.com
    name: assets-example-com-http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-1.1.0
  name: gzip-compression-ingress-assets-example-com
  namespace: default
spec:
  hostnames:
  - assets.example.com
  parentRefs:
  - name: nginx
  rules:
  - backendRefs:
    - name: static-service
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /assets
    name: rule-0
status:
  parents: []
