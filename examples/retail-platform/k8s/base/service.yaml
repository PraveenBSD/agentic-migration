apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: retail-prod
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: retail-prod
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
