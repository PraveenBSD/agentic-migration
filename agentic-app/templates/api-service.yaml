apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-app.apiName" . }}
  labels:
    {{- include "agentic-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "agentic-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
