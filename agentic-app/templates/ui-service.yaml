apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-app.uiName" . }}
  labels:
    {{- include "agentic-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
  selector:
    {{- include "agentic-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
