{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-app.secretName" . }}
  labels:
    {{- include "agentic-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.api.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
